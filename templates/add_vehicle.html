{% extends "base.html" %}

{% block title %}
    Add Vehicle
{% endblock title %}

{% block content %}
    <div class="form-box">
        <div class="form-box-header">
            <h2>Add Vehicle</h2>
            <a href="{{ url_for('admin') }}" class="btn-back">Back</a>
        </div>

        <form method="POST"
              action="{{ url_for('add_vehicle') }}"
              enctype="multipart/form-data">

            <!-- Vehicle type selector -->
            <div class="form-group">
                <label for="vehicle_type">Vehicle type</label>
                <select id="vehicle_type"
                        name="vehicle_type"
                        class="form-select"
                        onchange="showForm(this.value)">
                    <option value="" disabled selected hidden>Select a Vehicle</option>
                    <option value="car">Car</option>
                    <option value="supercar">SuperCar</option>
                    <option value="camper">Camper</option>
                    <option value="bike">Bike</option>
                    <option value="scooter">Scooter</option>
                    <option value="motorcycle">Motorcycle</option>
                </select>
            </div>

            <div id="image-upload-section" class="form-group" style="display:none;">
                <label for="img">Photo</label>
                <input type="file"
                       id="img"
                       name="img"
                       accept=".png,.jpg,.jpeg,.webp"
                       class="form-select">
            </div>

            <!-- CAR FORM -->
            <div id="form-car" class="vehicle-form">
                <!-- Brand -->
                <div class="form-group">
                    <label for="brand">Brand</label>
                    <select id="brand" name="brand" class="form-select" required>
                        <option value="" disabled selected hidden>Select a Brand</option>
                        <option value="alfa romeo">Alfa Romeo</option>
                        <option value="audi">Audi</option>
                        <option value="bmw">BMW</option>
                        <option value="citroen">Citroën</option>
                        <option value="fiat">Fiat</option>
                        <option value="ford">Ford</option>
                        <option value="honda">Honda</option>
                        <option value="hyundai">Hyundai</option>
                        <option value="jeep">Jeep</option>
                        <option value="mercedes">Mercedes</option>
                        <option value="opel">Opel</option>
                        <option value="peugeot">Peugeot</option>
                        <option value="renault">Renault</option>
                        <option value="toyota">Toyota</option>
                        <option value="volkswagen">Volkswagen</option>
                    </select>
                </div>
                <!-- Model -->
                <div class="form-group">
                    <label for="model">Model</label>
                    <input type="text"
                           id="model"
                           name="model"
                           class="form-select"
                           placeholder="Model"
                           required>
                </div>
                <!-- Rent Length -->
                <div class="form-group">
                    <label for="rent_length">Minimum Rent Length (Months)</label>
                    <input type="number"
                           id="rent_length"
                           name="rent_length"
                           class="form-select"
                           min="1"
                           max="24"
                           placeholder="1 - 24"
                           required>
                </div>
                <!-- Monthly Price -->
                <div class="form-group">
                    <label for="price">Monthly Price (€)</label>
                    <input type="number"
                           id="price"
                           name="price"
                           class="form-select"
                           min="1"
                           max="3000"
                           placeholder="1 - 3000"
                           required>
                </div>
                <!-- Power -->
                <div class="form-group">
                    <label for="power">Power (kW)</label>
                    <input type="number"
                           id="power"
                           name="power"
                           class="form-select"
                           min="30"
                           max="800"

                <!-- Fuel -->

                        <option value="" disabled selected hidden>Select a License Type</option>
                        <option value="A1">A1 (Up to 125cc / 11kW)</option>
                        <option value="A2">A2 (Up to 35kW)</option>
                        <option value="A">A (Unrestricted)</option>
                    </select>
                </div>
                <!-- Number of Seats -->
                <div class="form-group">
                    <label for="number_of_seats">Number of Seats</label>
                    <select id="number_of_seats"
                            name="number_of_seats"
                            class="form-select"
                            required>
                        <option value="" disabled selected hidden>Select Number of Seats</option>
                        <option value="1">1</option>
                        <option value="2">2</option>
                    </select>
                </div>
                <!-- Storage Capacity -->
                <div class="form-group">
                    <label for="storage_capacity">Storage Capacity (L)</label>
                    <input type="number"
                           id="storage_capacity"
                           name="storage_capacity"
                           class="form-select"
                           min="0"
                           max="150"
                           placeholder="0 - 150"
                           required>
                </div>
            </div>

            <!-- CAMPER FORM -->
            <div id="form-camper" class="vehicle-form">
                <!-- Brand -->
                <div class="form-group">
                    <label for="brand">Brand</label>
                    <select id="brand" name="brand" class="form-select" required>
                        <option value="" disabled selected hidden>Select a Brand</option>
                        <option value="adria">Adria</option>
                        <option value="burstner">Bürstner</option>
                        <option value="carado">Carado</option>
                        <option value="challenger">Challenger</option>
                        <option value="dethleffs">Dethleffs</option>
                        <option value="hymer">Hymer</option>
                        <option value="knaus">Knaus</option>
                        <option value="laika">Laika</option>
                        <option value="roller team">Roller Team</option>
                        <option value="volkswagen">Volkswagen (Campervans)</option>
                    </select>
                </div>
                <!-- Model -->
                <div class="form-group">
                    <label for="model">Model</label>
                    <input type="text"
                           id="model"
                           name="model"
                           class="form-select"
                           placeholder="Model"
                           required>
                </div>
                <!-- Rent Length -->
                <div class="form-group">
                    <label for="rent_length">Minimum Rent Length (Months)</label>
                    <input type="number"
                           id="rent_length"
                           name="rent_length"
                           class="form-select"
                           min="1"
                           max="24"
                           placeholder="1 - 24"
                           required>
                </div>
                <!-- Monthly Price -->
                <div class="form-group">
                    <label for="price">Monthly Price (€)</label>
                    <input type="number"
                           id="price"
                           name="price"
                           class="form-select"
                           min="1000"
                           max="8000"
                           placeholder="1000 - 8000"
                           required>
                </div>
                <!-- Type -->
                <div class="form-group">
                    <label for="type">Type</label>
                    <select id="type" name="type" class="form-select" required>
                        <option value="" disabled selected hidden>Select a Type</option>
                        <option value="campervan">Campervan</option>
                        <option value="low profile">Low Profile</option>
                        <option value="overcab">Overcab</option>
                        <option value="a-class">A-Class</option>
                    </select>
                </div>
                <!-- Fuel -->
                <div class="form-group">
                    <label for="fuel">Fuel</label>
                    <select id="fuel" name="fuel" class="form-select" required>
                        <option value="" disabled selected hidden>Select a Fuel Type</option>
                        <option value="petrol">Petrol</option>
                        <option value="diesel">Diesel</option>
                        <option value="hybrid">Hybrid</option>
                        <option value="electric">Electric</option>
                    </select>
                </div>
                <!-- Color -->
                <div class="form-group">
                    <label for="color">Color</label>
                    <select id="color" name="color" class="form-select" required>
                        <option value="" disabled selected hidden>Select a Color</option>
                        <option value="black">Black</option>
                        <option value="blue">Blue</option>
                        <option value="brown">Brown</option>
                        <option value="gray">Gray</option>
                        <option value="green">Green</option>
                        <option value="red">Red</option>
                        <option value="silver">Silver</option>
                        <option value="white">White</option>
                    </select>
                </div>
                <!-- Sleeping Beds -->
                <div class="form-group">
                    <label for="sleeping_beds">Sleeping Beds</label>
                    <select id="sleeping_beds" name="sleeping_beds" class="form-select" required>
                        <option value="" disabled selected hidden>Select Number of Sleeping Beds</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6">6</option>
                        <option value="7+">7+</option>
                    </select>
                </div>
                <!-- Approved Seats -->
                <div class="form-group">
                    <label for="approved_seats">Approved Seats</label>
                    <select id="approved_seats"
                            name="approved_seats"
                            class="form-select"
                            required>
                        <option value="" disabled selected hidden>Select Number of Approved Seats</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                        <option value="5">5</option>
                        <option value="6+">6+</option>
                    </select>
                </div>
                <!-- Type of Bathroom -->
                <div class="form-group">
                    <label for="type_bathroom">Type of Bathroom</label>
                    <select id="type_bathroom" name="type_bathroom" class="form-select" required>
                        <option value="" disabled selected hidden>Select Type of Bathroom</option>
                        <option value="none">None</option>
                        <option value="combined">Combined</option>
                        <option value="separated">Separated</option>
                    </select>
                </div>
                <!-- Climate Control -->
                <div class="form-group checkbox-inline">
                    <input type="checkbox" id="climate_control" name="climate_control">
                    <label for="climate_control">Climate Control</label>
                </div>
                <!-- Pets Allowed -->
                <div class="form-group checkbox-inline">
                    <input type="checkbox" id="pets_allowed" name="pets_allowed">
                    <label for="pets_allowed">Pets Allowed</label>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="btn-submit">Add Vehicle</button>
        </form>
    </div>
{% endblock content %}

{% block extra_js %}
    <script src="{{ url_for('static', filename='js/add_vehicle.js') }}"></script>
{% endblock extra_js %}
