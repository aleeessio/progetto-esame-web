<!DOCTYPE html>
<html lang="en">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniDrive</title>

    <style>
        /*------- RESET -------*/
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /*------- COLORS -------*/
        :root {
            --background-page: #f4f4f4;
            --background-div: #ffffff;
            --font-color: #1a1a1a;
            --logo-color: #FF6347;
            --border-color: #999;
            --icon-color: #1a1a1a;
        }

        .dark-mode {
            --background-page: #1d1d1d;
            --background-div: #242424;
            --font-color: #ffffff;
            --logo-color: #FF6347;
            --border-color: #333;
            --icon-color: #f1c40f;
        }

        body {
            background-color: var(--background-page);
            color: var(--font-color);
            transition: background-color 0.4s ease, color 0.4s ease;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        /*------- HEADER -------*/
        header {
            background: var(--background-div);
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
            position: relative;
        }

        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 1600px;
            margin: auto;
        }

        .left-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo {
            font-family: Arial, sans-serif;
            font-weight: 400;
            color: var(--logo-color);
            font-size: 2rem;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        nav a {
            color: var(--font-color);
            text-decoration: none;
        }

        .btn-theme {
            background-color: var(--background-div);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-theme svg {
            width: 24px;
            height: 24px;
            color: var(--icon-color);
            transition: color 0.4s ease;
        }

        .v-divider {
            border-left: 1px solid var(--border-color);
            align-self: stretch;
            margin: 0 15px;
        }

        .btn {
            padding: 8px 15px;
            border-radius: 5px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            min-width: 100px;
        }

        .b-lang {
            background: transparent;
            color: var(--font-color);
            border: 0px;
            cursor: pointer;
            padding: 1rem;
        }

        .b-login {
            background: var(--background-div);
            color: var(--font-color);
            border: 1px solid var(--border-color);
            transition: background 0.4s;
        }

        .b-login:hover {
            background: var(--logo-color);
        }

        .b-register {
            background: var(--background-div);
            color: var(--font-color);
            border: 1px solid var(--border-color);
            transition: background 0.4s;
        }

        .b-register:hover {
            background: var(--logo-color);
        }

        .b-profile {
            background: var(--background-div);
            color: var(--font-color);
            border: 1px solid var(--border-color);
            transition: background 0.4s;
        }

        .b-profile:hover {
            background: var(--logo-color);
        }


        /*------- MAIN -------*/
        .main-content {
            flex: 1;
        }


        /*------- FOOTER -------*/
        footer {
            background-color: var(--background-div);
            color: var(--font-color);
            padding: 40px 80px 20px;
            font-family: Arial, sans-serif;
		}

        .footer-division {
            display: flex;
			justify-content: space-between;
			gap: 60px;
			margin-bottom: 30px;
        }

        .footer-columns {
            flex: 1;
        }

        /*------- SX column -------*/
        .footer-columns h1 {
            color: var(--logo-color);
            margin-bottom: 20px;
        }

        .footer-columns p {
            line-height: 1.5;
            margin-top: 20px;
			margin-bottom: 20px;
		}

        /*------- Centre column -------*/
        .footer-columns ul {
            list-style: none;
            padding: 0;
        }

        .footer-columns ul li{
            margin-bottom: 10px;
        }

        .footer-columns ul li a {
            color: var(--font-color);
            text-decoration: none;
            transition: color 0.4s;
        }

        .footer-columns ul li a:hover {
            color: var(--logo-color);
        }

        /*------- DX column -------*/
        .newsletter {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .newsletter input {
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            background: var(--background-page);
            color: var(--font-color);
        }

        .newsletter input::placeholder {
            color: var(--border-color);
        }

        .newsletter button {
            padding: 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: var(--background-div);
            color: var(--font-color);
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            transition: background 0.4s;
        }

        .newsletter button:hover {
            background: var(--logo-color);
        }

        /*------- Footer Bottom -------*/
        .footer-bottom {
            display: flex;
            justify-content: space-between;
            border-top: 1px solid var(--border-color);
            padding-top: 15px;
            font-size: 14px;
		}

        .footer-links a {
            margin-right: 20px;
            color: #777;
            text-decoration: none;
            transition: color 0.4s;
        }
        .footer-links a:hover {
            color: var(--logo-color);
        }
    </style>
</head>

<body>
    <!--HEADER-->
    <header>
        <div class = "header-container">
            <div class = "left-header">
                <a href="index.html" style="text-decoration: none;"><div class="logo">OmniRide</div></a>
            </div>
            <div>
                <nav>
                    <!--Button Language-->
                    <form method="POST">
                        <button class="btn b-lang">EN</button>
                    </form>

                    <!--Buttons Theme-->
                    <button id="theme-toggle" class="btn-theme">
                    
                        <svg id="sun-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                        
                        <svg id="moon-icon" style="display: none;" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                    </button>
                    
                    <!--Buttons Login/Register/Profile-->
                    <div class="v-divider"></div>
                    <a href="login.html" class="btn b-login">Login</a>
                    <a href="/register" class="btn b-register">Register</a>
                    <a href="profile.html" class="btn b-profile" style="display: none;">Profile</a>
                </nav>
            </div>
        </div>
    </header>

    <main class="main-content">

    </main>

    <!--FOOTER-->
    <footer>
        <div class="footer-division">
            <!--Column Left-->
            <div class="footer-columns">
                <a href="index.html" style="text-decoration: none;"><div class="logo">OmniRide</div></a>
                <p>FRASI MOTIVAZIONALI SUL NOSTRO SITO WEB</p>
            </div>

            <!--Column Centre-->
            <div class="footer-columns">
                <h1>Links</h1>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="search.html">Search</a></li>
                    <li><a href="profile.html">Profile</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>

            <!--Column Right-->
            <div class="footer-columns">
                <h1>Newsletter</h1>
                <p>Iscriviti alla Newsletter</p>
                <form class="newsletter">
                    <input type="email" placeholder="Insert your email">
                    <button type="submit">Register</button>
                </form>
            </div>
        </div>

        <!--Bottom-->
        <div class="footer-bottom">
            <div class="footer-links">
                <a href="privacy_policy.html">Privacy Policy</a>
                <a href="terms_conditions.html">Terms and Conditions</a>
            </div>    
        </div>
    </footer>

    <script>
        //CHANGE THEME
        const btnTheme = document.getElementById('theme-toggle');
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');
        const body = document.body;
        btnTheme.addEventListener('click', () => {
            body.classList.toggle('dark-mode');

            if (body.classList.contains('dark-mode')) {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            } else {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            }
        });
    </script>
</body>
</html>
