{% extends "base.html" %}

{% block title %}
    Login
{% endblock title %}

{% block extra_css %}
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/login_register.css') }}"
          type="text/css">

{% endblock extra_css %}

{% block content %}
    <div class="register-box">
        <h2>Login</h2>

        <!-- Form -->
        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email"
                       id="email"
                       name="email"
                       placeholder="name@example.com"
                       required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Al least 6 characters"
                       required>
            </div>
            <button type="submit" class="btn-submit">Login</button>
        </form>

    </div>
{% endblock content %}
