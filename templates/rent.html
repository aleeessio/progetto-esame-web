{% extends "base.html" %}

{% block title %}
    Rent {{ vehicle.brand|capitalize }}
{% endblock title %}

{% block extra_css %}
    <link rel="stylesheet" href="{{ url_for('static', filename='css/rent.css') }}">
{% endblock extra_css %}

{% block content %}
    <div class="rent-layout">
        <!-- ===== COLONNA DESTRA: form ===== -->
        <div class="rent-form-box">
            <h2>Rental Request</h2>
            <p class="rent-form-sub">Fill in your details to confirm the request.</p>

            <form method="POST">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           value="{{ session.get('user_email', '') }}"
                           placeholder="name@example.com" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone"
                           placeholder="+39 XXX XXX XXXX" required>
                </div>

                <div class="date-row">
                    <div class="form-group">
                        <label for="start_date">Start Date</label>
                        <input type="date" id="start_date" name="start_date" required>
                    </div>
                    <div class="form-group">
                        <label for="end_date">End Date</label>
                        <input type="date" id="end_date" name="end_date" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="message">Notes <span class="optional">(optional)</span></label>
                    <textarea id="message" name="message" rows="3"
                              placeholder="Any additional requests..."></textarea>
                </div>

                <button type="submit" class="btn-submit">Confirm Rental Request</button>
            </form>
        </div>
    </div>
{% endblock content %}
